[package]
name = "overlay"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

eframe = { version = "0.27", features = ["default_fonts"] }
egui = "0.27"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
screenshots = "0.8"
cpal = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.14"
crc32fast = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }

[build-dependencies]
bindgen = "0.72"
vcpkg = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
raw-window-handle = "0.6"
# VAAPI hardware encoding included; Windows cross-compile omits it (VAAPI doesn't exist on Windows).
ffmpeg-sys-next = { version = "7", default-features = false, features = [
    "avcodec", "swscale",
    "build", "build-lib-x264", "build-license-gpl", "build-vaapi",
    "static",
] }

[target.'cfg(windows)'.dependencies]
# Needed for transparent click-through windows on Windows
winapi = { version = "0.3", features = ["winuser", "wingdi"] }
tray-icon = "0.14"
# No build* features: ffmpeg-sys-next's build feature passes --target-os=windows to FFmpeg configure
# which FFmpeg rejects (it needs --target-os=mingw32). Instead we pre-build FFmpeg ourselves via
# scripts/cross-windows.sh and point ffmpeg-sys-next at the result via FFMPEG_DIR.
ffmpeg-sys-next = { version = "7", default-features = false, features = [
    "avcodec", "swscale",
    "static",
] }
