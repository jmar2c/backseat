# fly.toml app configuration file generated for backseat on 2026-06-04T18:36:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backseat'
primary_region = 'iad'

[build]
  dockerfile = 'server/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
